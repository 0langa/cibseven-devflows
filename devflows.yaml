# How cibseven-devflows releases itself.
# Every command runs in this repository directory, on your machine.

gates:
  - name: tests
    # The integration tests drive a release through the engine. This gate runs
    # inside such a release, so including them here would start a release from
    # inside a release. Run them yourself with: uv run pytest -m integration
    run: uv run pytest -q -m "not integration"
  - name: lint
    run: uv run ruff check .

tag:
  format: "v{version}"

publish:
  run: gh release create v{version} --generate-notes
